<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A Rainy Place to Die</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #040508; color: #d8d8e0; }
      body { font: 13px/1.4 Consolas, 'Cascadia Mono', 'Yu Gothic', monospace; }
      canvas { display: block; }
      #hud {
        position: fixed; top: 8px; left: 8px; z-index: 2; padding: 6px 10px; white-space: pre;
        background: rgba(4, 5, 8, 0.8); border: 1px solid #2c2c3a; pointer-events: none;
      }
      #overlay {
        position: fixed; inset: 0; z-index: 1; display: grid; place-items: center; pointer-events: none;
        color: #cfc8c0; font: 700 20px 'Arial Narrow', 'Bahnschrift Condensed', Impact, 'Yu Gothic', sans-serif;
        letter-spacing: .4em; text-transform: uppercase; text-shadow: 2px 2px 0 #000, 0 0 14px rgba(176, 18, 28, 0.7);
      }
      #overlay[hidden] { display: none; }
      #loadbg { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: #040508; overflow: hidden; }
      /* the picture whole (its height fits the screen), its sides melting into a blurred, darkened copy of itself that fills the bars */
      #loadbg::before {
        content: ''; position: absolute; inset: -6%; background: var(--art) center / cover no-repeat;
        filter: blur(36px) brightness(0.35) saturate(1.15);
      }
      #loadbg::after {
        content: ''; position: absolute; top: 0; bottom: 0; left: 50%; width: min(100vh, 100vw); transform: translateX(-50%);
        background: var(--art) center / cover no-repeat; filter: brightness(0.75);
        -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 22%, #000 78%, transparent 100%);
        mask-image: linear-gradient(90deg, transparent 0%, #000 22%, #000 78%, transparent 100%);
      }
      #loadbar {
        position: fixed; left: 50%; top: calc(50% + 34px); z-index: 1; width: 180px; height: 2px; margin-left: -90px;
        background: rgba(176, 18, 28, 0.18); pointer-events: none; transition: opacity 0.4s;
      }
      #loadbar > div { height: 100%; width: 0; background: #b0121c; box-shadow: 0 0 8px rgba(176, 18, 28, 0.8); transition: width 0.6s ease-out; }
      #loadbar[hidden] { display: none; }
      .panel {
        position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 3; min-width: 420px; max-width: 70vw;
        padding: 16px 20px; background: rgba(12, 10, 18, 0.95); border: 1px solid #ff5fc8;
        box-shadow: 0 0 24px rgba(255, 95, 200, 0.35);
      }
      .panel h2 { margin: 0 0 10px; font-size: 16px; color: #ff5fc8; }
      .panel pre { margin: 0 0 10px; color: #b8c8d0; }
      #errors { position: fixed; inset: 0; z-index: 4; margin: 0; padding: 20px; background: #1a0808; color: #ff8a8a; white-space: pre-wrap; overflow: auto; }
    </style>
  </head>
  <body>
    <div id="hud"></div>
    <div id="loadbg"></div>
    <div id="overlay">Loading</div>
    <div id="loadbar"><div></div></div>
    <div id="vn" class="panel" hidden></div>
    <pre id="errors" hidden></pre>
    <script type="module" src="/src/poc3d/district/boot.ts"></script>
  </body>
</html>
