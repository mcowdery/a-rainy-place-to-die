<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>City Popper</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #07070b; color: #d8d8e0; }
      body { font: 13px/1.4 Consolas, 'Cascadia Mono', 'Yu Gothic', monospace; }
      #view { display: block; width: 100vw; height: 100vh; }
      #hud {
        position: fixed; top: 8px; left: 8px; padding: 6px 10px; white-space: pre;
        background: rgba(7, 7, 11, 0.72); border: 1px solid #2c2c3a; pointer-events: none;
      }
      #minimap {
        position: fixed; top: 8px; right: 8px; image-rendering: pixelated;
        border: 1px solid #2c2c3a; background: #07070b; transform: scale(1.25); transform-origin: top right;
      }
      .panel {
        position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); min-width: 420px; max-width: 70vw;
        padding: 16px 20px; background: rgba(12, 10, 18, 0.95); border: 1px solid #ff5fc8;
        box-shadow: 0 0 24px rgba(255, 95, 200, 0.35);
      }
      .panel h2 { margin: 0 0 10px; font-size: 16px; color: #ff5fc8; }
      .panel pre { margin: 0 0 10px; color: #b8c8d0; }
      .panel ul { list-style: none; margin: 0 0 10px; padding: 0; }
      .panel li { padding: 2px 6px; }
      .panel li.sel { background: #4fe3ff; color: #07070b; }
      #transit { border-color: #4fe3ff; box-shadow: 0 0 24px rgba(79, 227, 255, 0.35); }
      #transit h2 { color: #4fe3ff; }
      #errors { position: fixed; inset: 0; margin: 0; padding: 20px; background: #1a0808; color: #ff8a8a; white-space: pre-wrap; overflow: auto; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="hud"></div>
    <canvas id="minimap" hidden></canvas>
    <div id="vn" class="panel" hidden></div>
    <div id="transit" class="panel" hidden></div>
    <pre id="errors" hidden></pre>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
