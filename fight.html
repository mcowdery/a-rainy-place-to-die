<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fight Test</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #202226; color: #d8d8e0; }
      body { font: 13px/1.4 Consolas, 'Cascadia Mono', 'Yu Gothic', monospace; }
      canvas { display: block; }
      #hud {
        position: fixed; top: 8px; left: 8px; z-index: 2; max-width: calc(100% - 290px); padding: 6px 10px; white-space: pre-wrap;
        background: rgba(10, 10, 14, 0.8); border: 1px solid #34343f; pointer-events: none;
      }
      #panel {
        position: fixed; top: 8px; right: 8px; z-index: 2; width: 230px; max-height: calc(100% - 16px); overflow: auto;
        padding: 8px 10px; background: rgba(10, 10, 14, 0.85); border: 1px solid #34343f;
      }
      #panel h3 { margin: 8px 0 4px; font-size: 12px; color: #9aa0b0; font-weight: normal; text-transform: uppercase; letter-spacing: 1px; }
      #panel .row { display: flex; flex-wrap: wrap; gap: 3px; }
      #panel button {
        flex: 1 1 auto; padding: 3px 6px; text-align: left; white-space: nowrap; cursor: pointer;
        font: inherit; color: #d8d8e0; background: #22242c; border: 1px solid #3a3c48;
      }
      #panel p { flex: 1 1 100%; margin: 0; font-size: 12px; color: #b4b8c4; }
      #panel button:hover { background: #2e3140; }
      #panel button.on { border-color: #ff5fc8; color: #ffb0e0; }
    </style>
  </head>
  <body>
    <div id="hud"></div>
    <div id="panel"></div>
    <script type="module" src="/src/poc3d/fight/main.ts"></script>
  </body>
</html>
