# Manilaya's street races (format: src/poc3d/district/streetRace.ts): a field of seven cars through gates over the streets.
# Points are L0 grid points [col, row], the cell corners where the avenues cross (x = col * 128 m, z = row * 128 m);
# the first is the start (the grid stands on the road out of it), the last the finish. Every driver, you included,
# finds its own road between the gates: the river is crossed by the bridges at rows 3, 8, 13 and 17.
