# Manilaya's avenues (format: content/world3d/roads.yaml, src/poc3d/district/roads.ts). A run of cell-edge roads along
# one grid line: row n is the horizontal line at z = n * 128, col n the vertical one at x = n * 128.
# Built for driving and racing: the ring road, the cross-town avenues and the radials are all 24-32 m with
# medians, a few blocks apart, so every part of the city is within two blocks of a wide road and the grid is
# connected with no dead ends. The river (col 20) is crossed by bridges at rows 3, 8, 13 and 17.
avenues:
  # The ring road (Circumferential): up col 4, across row 2, down col 38, along the bay.
  - { name: Circumferential Road, col: 4, from: 2, to: 22, width: 32, median: 2.4 }
  - { name: Circumferential Road, col: 38, from: 2, to: 22, width: 32, median: 2.4 }
  - { name: Circumferential Road, row: 2, from: 4, to: 38, width: 32, median: 2.4 }
  - { name: Baywalk Boulevard, row: 22, from: 4, to: 38, width: 32, median: 2.4 }
  # Cross-town avenues.
  - { name: Risal Avenue, row: 8, from: 4, to: 38, width: 24, median: 2.4 }
  - { name: Tafto Avenue, row: 13, from: 4, to: 38, width: 28, median: 2.4 }
  - { name: Keson Avenue, row: 17, from: 4, to: 38, width: 24, median: 2.4 }
  # Radials north-south.
  - { name: Roxal Street, col: 10, from: 2, to: 22, width: 24, median: 2.4 }
  - { name: Bonifasyo Street, col: 15, from: 2, to: 22, width: 20, median: 2.4 }
  - { name: Magsalay Avenue, col: 26, from: 2, to: 22, width: 24, median: 2.4 }
  - { name: Aginaldo Avenue, col: 32, from: 2, to: 22, width: 28, median: 2.4 }
  # Wide avenues round the west bank (32 m).
  - { name: Gil Puyatan Avenue, row: 6, from: 6, to: 20, width: 32, median: 2.4 }
  - { name: Buendya Avenue, row: 14, from: 6, to: 20, width: 32, median: 2.4 }
  - { name: Del Pilas Street, col: 7, from: 5, to: 15, width: 32, median: 2.4 }
  - { name: Pasag Road, col: 19, from: 5, to: 15, width: 32, median: 2.4 }
bridges:
  - { name: Keson Bridge, row: 3, from: 20, to: 21, width: 24, median: 0 }
  - { name: Jonas Bridge, row: 8, from: 20, to: 21, width: 24, median: 2.4 }
  - { name: Tafto Bridge, row: 13, from: 20, to: 21, width: 28, median: 2.4 }
  - { name: MacArturo Bridge, row: 17, from: 20, to: 21, width: 24, median: 2.4 }
