# 鷹ノ台 Takanodai, the north-west heights (format: src/poc3d/district/zones.ts; the whole-city plan:
# docs/city-plan.md), after the quiet hill towns on the edge of Tokyo (Den-en-chofu, Seijo): big houses behind
# hedges and walls on wide lots, trees over the lanes, the summit's woods and the lookout, a ryokan on the upper
# terrace; low apartments down at the foot of the hill (Takanodai-shita). The heights are terraces in
# terrain.yaml: the upper plateau at 10 m and the summit at 22 m, the streets climbing between them.
