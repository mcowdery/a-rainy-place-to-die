# Sakuragaoka (桜ヶ丘), the residential district west of Asagiri (format: src/poc3d/district/zones.ts), after the
# quiet neighbourhoods west of Shinjuku: two-storey houses on narrow lanes under the power lines, pots and
# bicycles at every door, apartment blocks, a small park, and a shopping street along the Seikō Line's road
# (the private railway from the terminal, under the road between rows 9 and 10). The residential style
# is generated only where this map paints (onlyZoned): the R cells round the centre stay open ground.
district: residential
origin: [14, 9]
map:
  - HHMMHH
  - SSSSSM
  - HKHHMH
  - MHHHHH

zones:
  H:
    id: sakuragaoka_houses
    name: Sakuragaoka (houses)
    plan:
      floors: [[2, 2, 70], [3, 3, 22], [4, 5, 8]]
      lotW: [7, 11]
      localStreet: [3, 4.5]
      block: [16, 36]
      lotGap: 0.45
      signChance: 0.05
      open: { parking: 0.07, vacant: 0.04, playground: 0.03 }
      rear: [1.5, 3.5]
      setback: [0.8, 2.4]
      streetTrees: 0.15
      hedges: 0.1
      pots: 0.6
    ads: { street: 2, food: 1, mainstream: 1 }
    look:
      windows: { punched: 45, small: 30, balcony: 25 }
      walls: ['#d8d0c0', '#c8c0b0', '#e8e0d0', '#b8a890', '#a8b0b8', '#d0c8b8', '#8a7a6a']
      tiled: true
