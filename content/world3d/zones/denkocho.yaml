# 電光町 Denkō-chō, the electric town east of Kaburo (Akihabara-like; format: src/poc3d/district/zones.ts; the
# whole-city plan: docs/city-plan.md). Denkō-dōri, the main street, runs down its middle (col 34) lined with tall
# narrow buildings covered in signs; parts shops and arcades fill the back streets; maid cafés, anime and card
# shops along the lanes to the north; the station quarter where the Kawabata Line will cross (row 11).
# Set pieces: the idol theatre, the game-centre tower, the multi-storey car park.
district: electric
origin: [32, 8]
map:
  - BCCCB
  - BMMCB
  - BMMCB
  - SMMSS
  - BMMBB
  - BBBBB

zones:
  M:
    id: denko_main
    name: Denkō-dōri
    plan:
      floors: [[6, 9, 40], [10, 14, 45], [15, 20, 15]]
      lotW: [6, 12]
      signChance: 1
      verticalSign: 0.8
    signs:
      words: [電気街, 総合免税店, PC, ゲーム, アニメ, フィギュア, ホビー, カード, 中古PC, 買取, DUTY FREE, 電光電気, メガネ, オーディオ, 家電, スマホ, カメラ, 無線]
      colors: ['#ff5fc8', '#4fe3ff', '#ffe45f', '#6bff8a', '#ff4f4f', '#ffffff', '#ff9a2a']
