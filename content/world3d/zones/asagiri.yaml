    id: skyscraper_row
    name: Skyscraper Row
    plan:
      floors: [[14, 24, 35], [26, 40, 45], [42, 55, 20]]
      lotW: [18, 30]
      localStreet: [8, 12]
      block: [40, 70]
      twoRowDepth: 40
