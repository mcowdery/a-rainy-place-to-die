# Asagiri's zones (format: src/poc3d/district/zones.ts): the business district west of Kaburo, loosely
# after West Shinjuku. Skyscraper rows fill the west, a plaza of the tallest towers sits in the middle,
# department stores line the west exit along the Toto Line, and a narrow yakitori lane hugs the tracks.
district: tower
origin: [20, 9]
map:
  - KKKKEE
  - KGGKEE
  - KGGKEY
  - KKKKEE
  - KKKEEE

zones:
