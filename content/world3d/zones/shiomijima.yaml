# 汐見島 Shiomi-jima, the harbour island (Odaiba-like; format: src/poc3d/district/zones.ts; the whole-city plan:
# docs/city-plan.md), over the Shiomi bridge from the port. An event quarter across the middle (the TV station, the
# concert hall), bayside towers to the south-east, and a seaside park round the west and east shores, where the
# Sky Wheel stands in the open.
