# 川端 Kawabata, the old town across the river (Asakusa / Yanaka-like; format: src/poc3d/district/zones.ts; the
# whole-city plan: docs/city-plan.md). The riverside strip along the embankment (col 38: the promenade, food stalls,
# houseboats), the temple quarter and its shopping streets to the north, the tower's plaza, and wooden houses and
# apāto on narrow lanes everywhere else (the detective lives here; the Rindō-gumi's family house stands among them).
