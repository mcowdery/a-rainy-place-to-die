# Hotel Rouge (ホテル ルージュ): the Love District's flagship, a castle love hotel. A landmark built by
# real/loveHotel.ts (34 m front, 30 m deep): pastel keep, corner towers with red cones, a donjon, pink neon,
# and a discreet entrance behind a screen wall. Inside (real/rougeInterior.ts; its floor plan is
# content/world3d/rouge_plan.json; the rooms are baked Blender models, assets/interiors/rouge_xl_*.glb): the lobby with
# its room panel, the front office, the garage, the back hall, and up a switchback stair two floors of themed rooms
# (every one real and openable), the laundry, housekeeping and the manager's office. You walk in through the front doors
# (they slide open) or the doorway in the west wall into the back hall. Room 303, the Rouge Suite, is the story's: its
# desk is a handoff node (the VN).
