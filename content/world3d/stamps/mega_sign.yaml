# Kaburo mega-sign: the corner tower on the central crossing, wrapped in LED screens and crowned by the
# neon dragon. A landmark: the chunk workers only reserve its footprint and forecourt; the tower, screens
# and dragon are built on the main thread by real/megaSign.ts. Its rounded corner faces south-west, so place
# it on the north-east corner of a junction.
id: mega_sign
name: Kaburo Crossing
footprint: [20, 20]
height: 35
front: south
landmark: mega_sign
# The crossing: the junction's south-west corner, across from the tower, is an open square (the junction
# centre is 10 m west and 36 m south of the footprint's NW corner when placed at offset [10, 92]: the tower stands
# back from 夜霧通り Yogiri-dōri, the avenue along its south side).
plaza: { at: [-44, 36], size: [40, 40] }
# The junction itself is a scramble crossing.
scramble: [-10, 36]
nodes:
  # Kaburo's front door: across the crossing from the tower (on the far pavement of the avenue), looking up
  # at the dragon.
  view:
    kind: spawn
    name: Kaburo Crossing
    at: [-34, 42]
    facing: north
    view: [-42, 20]
