# The Tōto Expressway (東都高速): elevated routes over the cell-edge roads, Shuto-style (format and layout:
# src/poc3d/district/expressway.ts), above the avenues of roads.yaml (32 m, the piers in their medians). So far
# the inner loop (都心環状線) round Asagiri and Kaburo.
# The network (docs/city-plan.md has where it's going: route 4 to Kurokami, route 1 and the Wangan to the port).
# routes: each a list of L0 grid points [col, row] (its corners), driven in that order; loop: true closes it back
# to its first point (the inner loop, clockwise on the map: east along its north side). deck: the road surface's
# height (m; clear of the Toto Line's viaduct, 8 m, and its trains); radius: the corners (m, tight, Shuto-like);
# half: the deck's half-width (two lanes and a shoulder). trim: [start, end], metres of deck left off an open
# route's ends: where nothing runs on past its last ramp or junction the deck stops there behind an end wall,
# rather than running on to its point as a dead stub (its ramps are still placed from the points).
name: 東都高速
nameEn: TOTO EXPRESSWAY
deck: 15
radius: 20
half: 4.6
routes:
  - { id: c1, name: 都心環状線, nameEn: INNER LOOP, loop: true, pts: [[21, 10], [31, 10], [31, 13], [21, 13]] }
# Route 1 (1号線) from the loop's south side down Kōnan-dōri to the Wangan, and the Wangan (湾岸線) along the port
# a block in from the seawall, each two-way: a route each way, offset left of the line, decks side by side.
  - { id: r1_s, name: 1号線 南行, nameEn: ROUTE 1 SOUTH, loop: false, offset: 5.2, pts: [[24, 13], [24, 21]] }
  - { id: r1_n, name: 1号線 北行, nameEn: ROUTE 1 NORTH, loop: false, offset: 5.2, pts: [[24, 21], [24, 13]] }
# (Its west end is the airport branch's junction at col 8: nothing runs on to col 7.)
  - { id: wangan_e, name: 湾岸線 東行, nameEn: WANGAN EAST, loop: false, offset: 5.2, pts: [[7, 21], [41, 21]], trim: [116, 0] }
  - { id: wangan_w, name: 湾岸線 西行, nameEn: WANGAN WEST, loop: false, offset: 5.2, pts: [[41, 21], [7, 21]], trim: [0, 116] }
# The airport branch off the Wangan's west end, over the Hanejima bridge's upper deck. The deck ends at the bridge's
# island end (row 23); its ramps run on down Kūkō-dōri to their feet before row 24.
  - { id: airport_s, name: 空港線 南行, nameEn: AIRPORT SOUTH, loop: false, offset: 5.2, pts: [[8, 21], [8, 24]], trim: [0, 122] }
  - { id: airport_n, name: 空港線 北行, nameEn: AIRPORT NORTH, loop: false, offset: 5.2, pts: [[8, 24], [8, 21]], trim: [122, 0] }
# The branch off the Wangan over the Shiomi bridge's upper deck to Shiomi-jima. The deck ends past the bridge's
# cable anchors, mid-block, between its ramps.
  - { id: shiomi_s, name: 汐見線 南行, nameEn: SHIOMI SOUTH, loop: false, offset: 5.2, pts: [[28, 21], [28, 24]], trim: [0, 64] }
  - { id: shiomi_n, name: 汐見線 北行, nameEn: SHIOMI NORTH, loop: false, offset: 5.2, pts: [[28, 24], [28, 21]], trim: [64, 0] }
# The suspension bridge (a look: its decks are the routes above and, below, the street bridge in roads.yaml).
suspension:
  - { col: 28, from: 22.1, to: 22.9, width: 36, name: 汐見大橋 }
# Ramps, joining the outside (left) lane of a route, their feet in the inner lane of the avenue below (beside the
# median; high up they swing out beside the deck, on arms from its piers): route, leg (from point
# `leg` to the next), block (which 128 m block of that leg, from its start in the direction of travel). An
# on-ramp rises from the start of its block; an off-ramp comes down to the end of its block. name: the district,
# for the signs.
ramps:
  - { id: asagiri_n_off, kind: off, route: c1, leg: 0, block: 2, name: 朝霧 ASAGIRI }
  - { id: asagiri_n_on, kind: on, route: c1, leg: 0, block: 3, name: 朝霧 ASAGIRI }
  - { id: kaburo_n_off, kind: off, route: c1, leg: 0, block: 6, name: 歌舞路 KABURO }
  - { id: kaburo_n_on, kind: on, route: c1, leg: 0, block: 7, name: 歌舞路 KABURO }
  - { id: kaburo_s_off, kind: off, route: c1, leg: 2, block: 2, name: 歌舞路 KABURO }
  - { id: kaburo_s_on, kind: on, route: c1, leg: 2, block: 3, name: 歌舞路 KABURO }
  - { id: asagiri_s_off, kind: off, route: c1, leg: 2, block: 6, name: 朝霧 ASAGIRI }
  - { id: asagiri_s_on, kind: on, route: c1, leg: 2, block: 7, name: 朝霧 ASAGIRI }
# The port: route 1's pair over Kōnan-dōri; the Wangan's at each end (the stubs run on to the airport branch in the
# west and over the river to the old town in the east).
  - { id: port_s_off, kind: off, route: r1_s, leg: 0, block: 5, name: 東都港 TŌTO PORT }
  - { id: port_n_on, kind: on, route: r1_n, leg: 0, block: 2, name: 東都港 TŌTO PORT }
  - { id: terminal_e_on, kind: on, route: wangan_e, leg: 0, block: 1, name: 東都港 TERMINAL }
  - { id: terminal_w_off, kind: off, route: wangan_w, leg: 0, block: 32, name: 東都港 TERMINAL }
  - { id: fishmarket_w_on, kind: on, route: wangan_w, leg: 0, block: 6, name: 東都市場 FISH MARKET }
  - { id: fishmarket_e_off, kind: off, route: wangan_e, leg: 0, block: 27, name: 東都市場 FISH MARKET }
# Ebisu-jima (the parking area and the car meets), off the Wangan; Shiomi-jima, at the end of its branch.
  - { id: ebisu_e_off, kind: off, route: wangan_e, leg: 0, block: 8, name: 恵比寿島PA EBISU-JIMA PA }
  - { id: ebisu_w_on, kind: on, route: wangan_w, leg: 0, block: 24, name: 恵比寿島 EBISU-JIMA }
  - { id: shiomi_off, kind: off, route: shiomi_s, leg: 0, block: 2, name: 汐見島 SHIOMI-JIMA }
  - { id: shiomi_on, kind: on, route: shiomi_n, leg: 0, block: 0, name: 汐見島 SHIOMI-JIMA }
  - { id: airport_off, kind: off, route: airport_s, leg: 0, block: 2, name: 東都空港 AIRPORT }
  - { id: airport_on, kind: on, route: airport_n, leg: 0, block: 0, name: 東都空港 AIRPORT }
# Exits to the passes: at a route's point (a loop's corner, or an open route's end) the outside lane runs straight
# on into a tunnel (a spur), signed to a venue. length: the spur's run to the portal.
exits:
  - { id: kurokami, venue: kurokami, route: c1, at: 0, length: 110, name: 黒神峠 KUROKAMI }
# Yūnagi: at the Wangan's east end, past the river mouth, into the headland (hill: its height in metres).
  - { id: yunagi, venue: yunagi, route: wangan_e, at: 1, length: 110, name: 夕凪峠 YŪNAGI, hill: 70 }
