# Subway lines (format: src/poc3d/district/subway.ts). Each line runs straight under a road; its stations are
# placements of subway stamps (landmark: subway) whose street face is 10 m from the line, listed in order.
# Station numbers come from the letter and the order (Y01, Y02...). transfers: stations you can change
# between (a short walk through the streets, or the underground mall). The Toto Line joins from rail.yaml.
lines:
  - id: yako
    name: 夜光線
    nameEn: YAKŌ LINE
    letter: Y
    color: '#9b6cff'
    stations: [y01_station, y02_station, y03_station, y04_station, y05_station]
  - id: wakaba
    name: 若葉線
    nameEn: WAKABA LINE
    letter: W
    color: '#b5d62a'
    stations: [w01_station, w02_station, w03_station, w04_station, w05_station, w06_station]
  # The private railway from the terminal out through Sakuragaoka to Nishihara (underground all the way).
  - id: seiko
    name: 西光線
    nameEn: SEIKŌ LINE
    letter: S
    color: '#2a6ad0'
    stations: [s01_station, s02_station, s03_station, s04_station, s05_station, s06_station]
transfers:
  - [y04_station, w02_station]
  - [totochuo_station, y03_station]
  - [s01_station, totochuo_station]
  # The Kawabata Line from Kaburo Crossing's station; the monorail from the Toto Line at Kasumi-chō.
  - [kaburohigashi_station, y05_station]
  - [mono_kasumicho_station, kasumicho_station]
  - [w04_station, kasumicho_station]
