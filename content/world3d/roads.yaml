  - { name: 川端バス通り, row: 9, from: 40, to: 42, width: 12, median: 0 }
  - { name: 川端バス通り, col: 40, from: 9, to: 13, width: 12, median: 0 }
  - { name: 川端バス通り, col: 42, from: 9, to: 13, width: 12, median: 0 }
  - { name: 桜ヶ丘通り, row: 9, from: 11, to: 20, width: 12, median: 0 }
  - { name: 西原通り, row: 11, from: 11, to: 20, width: 12, median: 0 }
  - { name: 西原通り, col: 11, from: 9, to: 11, width: 12, median: 0 }
bridges:
