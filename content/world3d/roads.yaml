# Avenues (大通り): cell-edge roads built wider than their district's own, for driving (format and checks:
# src/poc3d/district/roads.ts). A run of cell edges along one grid line:
#   row: n   the horizontal line at z = n * 128 (between L0 rows n-1 and n), from/to: the columns it spans [from, to)
#   col: n   the vertical line at x = n * 128 (between L0 columns n-1 and n), from/to: the rows it spans
# width: kerb to kerb plus both pavements (m); median: a raised central strip (m, 0 for none), where the
# expressway's piers stand. Later entries override earlier ones on the same edge.
#
# The four round the Tōto Expressway's inner loop (expressway.yaml), 32 m: two lanes each way either side of
# the median, 3 m pavements, the deck overhead. They run a block on past the loop's corners (so the corner
# junctions are wide both ways). Yogiri-dōri, Kaburo Crossing's avenue a block inside the loop's south side
# (Yasuhara-dōri, along Kaburo's southern edge), is as wide, without the deck.
avenues:
  - { name: 東都大通り TŌTO-ŌDŌRI, row: 10, from: 20, to: 32, width: 32, median: 2.4 }
  - { name: 夜霧通り YOGIRI-DŌRI, row: 12, from: 20, to: 32, width: 32, median: 2.4 }
  - { name: 靖原通り YASUHARA-DŌRI, row: 13, from: 20, to: 32, width: 32, median: 2.4 }
  - { name: 朝霧西通り ASAGIRI-NISHI-DŌRI, col: 21, from: 9, to: 18, width: 32, median: 2.4 }
  - { name: 明王通り MYŌŌ-DŌRI, col: 31, from: 9, to: 18, width: 32, median: 2.4 }
# Kasumi-chō and the port (docs/city-plan.md): the radials above run on south to the harbour front; Kaigan-dōri
# along the harbour front; Kasumi-dōri across Kasumi-chō; the harbour radial's avenue (route 1 overhead).
  - { name: 海岸通り KAIGAN-DŌRI, row: 18, from: 7, to: 37, width: 32, median: 2.4 }
  - { name: 霞通り KASUMI-DŌRI, row: 16, from: 8, to: 37, width: 20, median: 0 }
  - { name: 港南通り KŌNAN-DŌRI, col: 24, from: 13, to: 21, width: 32, median: 2.4 }
# Under the Wangan, a block in from the seawall (its two decks over the carriageways, piers in the median).
  - { name: 湾岸道路 WANGAN-DŌRO, row: 21, from: 6, to: 37, width: 32, median: 2.4 }
# The way to Shiomi-jima: Shiomi-dōri down to the seawall, over the bridge, and on across the island (the
# expressway's branch over it, its ramps on the island).
  - { name: 汐見通り SHIOMI-DŌRI, col: 28, from: 21, to: 22, width: 32, median: 2.4 }
  - { name: 汐見通り SHIOMI-DŌRI, col: 28, from: 23, to: 26, width: 32, median: 2.4 }
# The way to the airport: Kūkō-dōri down through the container terminal, over the bridge, into Hanejima.
  - { name: 空港通り KŪKŌ-DŌRI, col: 8, from: 21, to: 22, width: 32, median: 2.4 }
  - { name: 空港通り KŪKŌ-DŌRI, col: 8, from: 23, to: 25, width: 32, median: 2.4 }

# The Toto Line's viaduct runs on south through Kasumi-chō over its own street, as wide as it is between the districts.
  - { name: 高架下通り KŌKASHITA-DŌRI, col: 26, from: 14, to: 17, width: 16, median: 0 }
  # Past the terminal, Tōto-ōdōri narrows over the Seikō Line's Tōto-Chūō station (subway stations stand
  # 10 m from their road's centre, so a road with a line under it is 20 m at most).
  - { name: 東都大通り TŌTO-ŌDŌRI, row: 10, from: 25, to: 26, width: 20, median: 2.4 }

# Street bridges over the water (roads.ts parseBridges): along a grid line, across the water cells from..to; the
# cell-edge roads either side carry on over it. The Shiomi bridge's upper deck is the expressway's (expressway.yaml).
bridges:
  - { name: 汐見大橋 SHIOMI-ŌHASHI, col: 28, from: 22, to: 23, width: 32, median: 2.4 }
  - { name: 羽根島大橋 HANEJIMA-ŌHASHI, col: 8, from: 22, to: 23, width: 32, median: 2.4 }
