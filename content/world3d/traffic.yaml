# Traffic on the roads along the L0 cell edges. A loop is a rectangle of grid lines [col0, row0, col1, row1];
# every edge must have generated cells on both sides (both halves of the road exist). Cars drive the loops
# clockwise and keep left; loops that share an edge use its two lanes in opposite directions. Buses drive
# their loops anticlockwise (the other lane of the outer edges), on the kerb of the loop's inside.
# A bus line's stops: the places it serves, in the order it reaches them (anticlockwise: down the west side, east
# along the south, up the east, west along the north). Each is the cell beside the loop on its inside, and the side
# of the loop: { name, cell: [col, row], side } (or { name, at: <a placement's id> } for the block nearest a set
# piece). The game picks the spot in that block and what kind of stop fits the pavement (district/stops.ts,
# docs/street-furniture-plan.md). Four plain names, north, east, south, west, is the old form: one stop a side.
# auto: generated car loops over the rest of the city (district/traffic.ts carLoops): squares of `size` cells on a
# fixed lattice wherever no loop is, every edge a proper street (raised pavements) with generated cells both sides.
auto: { size: 2, spacing: 52 }
cars:
  - { rect: [26, 10, 28, 12], spacing: 48 }
  - { rect: [28, 10, 30, 12], spacing: 48 }
  - { rect: [30, 10, 31, 12], spacing: 56 }
  - { rect: [21, 10, 23, 13], spacing: 52 }
  - { rect: [23, 10, 25, 13], spacing: 52 }
  - { rect: [25, 10, 26, 12], spacing: 44 }
buses:
  - id: kaburo
    name: 歌舞路循環
    en: KABURO LOOP
    rect: [26, 10, 31, 12]
    buses: 2
    stops:
