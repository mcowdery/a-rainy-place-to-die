# 黒神峠 Kurokami Pass (the handling test course). Format: src/race/course.ts.
# A floodlit practice lot at the foot of the mountain, then the pass: up a hillside that rises to the north,
# two hairpins, sweepers and an S-section, to a viewpoint at the summit. World x east, z south, metres.
name: 黒神峠 Kurokami Pass
blurb: A black cedar pass above the city, two hairpins and an S to the summit viewpoint. Floodlit practice lot at the foot, with a shooting range.
# Night: a cold moon, the city's glow low on the horizon, stars.
atmosphere:
  label: Night
  sky: ['#04050c', '#0a0e1e', '#1a1a30', '#3a2438']
  fog: { color: '#0c1020', density: 0.0042 }
  light: { color: '#8a9ad0', intensity: 0.35, from: [-300, 400, 200] }
  hemi: { sky: '#243052', ground: '#0a0a0c', intensity: 0.45 }
  stars: 1
  sun: false
  exposure: 1.1
# Time trial medals (seconds): [bronze, silver, gold].
trial:
  up: [75, 66, 58]
  down: [70, 61, 53]
# The practice lot (flat, at height 0): its rect; the road leaves from the middle of its north edge.
lot: { x: -90, z: -60, w: 180, h: 130 }
road:
  width: 7.2
  shoulder: 1.2
  # How steeply the hillside rises to the north (m per m), and how rough it is (m).
  slope: 0.115
  rough: 5
  # Control points [x, z] (the road runs through them, a smooth curve); heights come from the hillside.
  points:
    - [0, -60]
    - [0, -110]
    - [8, -160]
    - [45, -200]
    - [105, -222]
    - [150, -232]
    # First hairpin: right, back to the west.
    - [178, -246]
    - [188, -268]
    - [176, -288]
    - [150, -296]
    - [95, -300]
    - [20, -306]
    - [-60, -318]
    - [-112, -330]
    # Second hairpin: left, back to the east.
    - [-140, -348]
    - [-146, -372]
    - [-128, -392]
    - [-96, -400]
    - [-30, -410]
    - [35, -418]
    # S-section up to the summit.
    - [80, -440]
    - [92, -472]
    - [70, -505]
    - [62, -540]
    - [88, -575]
    - [110, -610]
# The viewpoint at the top: a round lot at the road's end.
summit: { r: 20 }

# Shooting practice in the lot (format: TargetDef in src/race/course.ts). Paper boards down the west side and
# across the north end, steel plates along the east side, six round the drift circle (centre about 32, 11.5)
# facing in, for shooting while you drift round it, and two boards sliding along the south end.
targets:
  # West line, facing east.
  - { kind: board, at: [-84, -35], face: 90 }
  - { kind: board, at: [-84, -20], face: 90 }
  - { kind: board, at: [-84, -5], face: 90, h: 1.8 }
  - { kind: board, at: [-84, 10], face: 90 }
  - { kind: board, at: [-84, 25], face: 90, h: 1.1 }
  - { kind: board, at: [-84, 40], face: 90 }
  - { kind: board, at: [-84, 52], face: 90 }
  # North end, facing south (clear of the road out in the middle).
  - { kind: board, at: [-60, -54], face: 0 }
  - { kind: board, at: [-35, -54], face: 0 }
  - { kind: board, at: [35, -54], face: 0 }
  - { kind: board, at: [60, -54], face: 0 }
  # East rack of steel plates, facing west.
  - { kind: plate, at: [84, -40], face: -90 }
  - { kind: plate, at: [84, -25], face: -90, h: 1.7 }
  - { kind: plate, at: [84, -10], face: -90 }
  - { kind: plate, at: [84, 5], face: -90, h: 0.9 }
  - { kind: plate, at: [84, 20], face: -90 }
  - { kind: plate, at: [84, 35], face: -90, h: 1.6 }
  - { kind: plate, at: [84, 50], face: -90 }
  # Round the drift circle, 27 m out from its centre, facing in.
  - { kind: plate, at: [59.4, 11.5], face: -90 }
  - { kind: board, at: [45.9, 34.9], face: -150 }
  - { kind: plate, at: [18.9, 34.9], face: 150 }
  - { kind: board, at: [5.4, 11.5], face: 90 }
  - { kind: plate, at: [18.9, -11.9], face: 30 }
  - { kind: board, at: [45.9, -11.9], face: -30 }
  # South end: two boards on rails, facing north.
  - { kind: mover, at: [-20, 63], to: [75, 63], speed: 4, face: 180 }
  - { kind: mover, at: [75, 56], to: [-20, 56], speed: 6, face: 180, h: 1.2 }
