<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Garage</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #05060a; color: #e8e6f0; }
      body { font: 13px/1.45 Consolas, 'Cascadia Mono', 'Yu Gothic', monospace; }
      canvas { display: block; }
      #title { position: fixed; top: 14px; left: 18px; font: bold 26px 'Yu Gothic', Consolas, sans-serif; color: #ff8ad0; text-shadow: 0 0 16px rgba(255, 90, 180, 0.5); letter-spacing: 3px; }
      #title span { font: 13px Consolas, monospace; color: #a8b0c8; letter-spacing: 1px; }
      #wallet { position: fixed; top: 52px; left: 18px; font: bold 22px Consolas, monospace; color: #ffe07a; }
      #wallet small { display: block; font-size: 11px; color: #8a90a8; font-weight: normal; }
      #toast { position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%); padding: 8px 18px; background: rgba(10, 10, 20, 0.85); border: 1px solid rgba(126, 240, 176, 0.5); color: #7ef0b0; border-radius: 4px; opacity: 0; pointer-events: none; }
      #hint { position: fixed; left: 18px; bottom: 14px; color: #6a7088; font-size: 12px; }
      #panel { position: fixed; top: 0; right: 0; bottom: 0; width: 390px; background: rgba(10, 10, 18, 0.88); border-left: 1px solid rgba(160, 170, 210, 0.15); display: flex; flex-direction: column; }
      #panel .car { padding: 16px 18px 6px; font-size: 17px; color: #fff; }
      #panel .tabs { display: flex; gap: 4px; padding: 6px 14px; border-bottom: 1px solid rgba(160, 170, 210, 0.15); }
      #panel .tab { flex: 1; padding: 7px 0; background: none; border: 1px solid transparent; border-radius: 4px; color: #a8b0c8; font: inherit; cursor: pointer; }
      #panel .tab.on { color: #fff; border-color: rgba(255, 138, 208, 0.5); background: rgba(255, 138, 208, 0.12); }
      #panel .body { flex: 1; overflow-y: auto; padding: 8px 16px 16px; }
      #panel h3 { margin: 14px 0 6px; font-size: 12px; color: #ffcf6a; letter-spacing: 1px; font-weight: normal; }
      #panel h3 small { color: #8a90a8; }
      #panel p { color: #a8b0c8; font-size: 12px; margin: 6px 0; }
      button { font: inherit; cursor: pointer; }
      .row { display: flex; justify-content: space-between; width: 100%; margin: 3px 0; padding: 7px 10px; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 4px; color: #e8e6f0; text-align: left; }
      .row.on { border-color: rgba(255, 138, 208, 0.55); background: rgba(255, 138, 208, 0.1); }
      .row span, .row small { color: #8a90a8; }
      .detail { margin-top: 12px; padding: 10px 12px; background: rgba(255, 255, 255, 0.03); border-radius: 5px; }
      .buy { width: 100%; margin-top: 12px; padding: 9px; background: rgba(126, 240, 176, 0.15); border: 1px solid rgba(126, 240, 176, 0.6); color: #7ef0b0; border-radius: 4px; }
      .buy:disabled, .part button:disabled { opacity: 0.35; cursor: default; }
      .stats { margin: 8px 0; }
      .stat { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
      .stat span { width: 72px; color: #a8b0c8; }
      .stat i { position: relative; flex: 1; height: 8px; background: #20202c; border-radius: 4px; overflow: hidden; }
      .stat b { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, #4fe3ff, #a86bff); }
      .stat u { position: absolute; top: 0; bottom: 0; }
      .stat u.up { background: #7ef0b0; }
      .stat u.down { background: #ff6a78; }
      .stat em { width: 76px; text-align: right; font-style: normal; color: #e8e6f0; }
      .layout { color: #8a90a8; font-size: 11px; margin-top: 4px; }
      .part { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.06); }
      .part b { display: block; }
      .part span { color: #8a90a8; font-size: 12px; margin-right: 6px; }
      .part .pips i { display: inline-block; width: 8px; height: 8px; margin-right: 2px; border-radius: 2px; background: #2a2a38; }
      .part .pips i.on { background: #ff8ad0; }
      .part button { padding: 6px 8px; background: rgba(255, 138, 208, 0.12); border: 1px solid rgba(255, 138, 208, 0.45); color: #fff; border-radius: 4px; font-size: 12px; white-space: nowrap; }
      .part em { color: #7ef0b0; font-style: normal; }
      .swatches, .neons, .numbers { display: flex; flex-wrap: wrap; gap: 6px; }
      .sw { width: 30px; height: 30px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.2); color: #8a90a8; }
      .sw.on { border-color: #fff; transform: scale(1.12); }
      .numbers button { padding: 5px 9px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.12); color: #e8e6f0; border-radius: 4px; }
      .numbers button.on { border-color: #ff8ad0; color: #fff; }
      .numbers input { width: 70px; background: #14141c; border: 1px solid rgba(255, 255, 255, 0.15); color: #fff; padding: 5px; font: inherit; border-radius: 4px; }
      a.drive { display: block; margin: 12px 16px 16px; padding: 12px; text-align: center; background: rgba(255, 138, 208, 0.18); border: 1px solid rgba(255, 138, 208, 0.6); border-radius: 5px; color: #fff; text-decoration: none; font-size: 15px; }
      a.drive:hover { background: rgba(255, 138, 208, 0.3); }
    </style>
  </head>
  <body>
    <div id="title">ガレージ <span>garage · under the Toto Line</span></div>
    <div id="wallet"></div>
    <div id="panel"></div>
    <div id="toast"></div>
    <div id="hint">drag to look round the car · wheel to zoom</div>
    <script type="module" src="/src/race/garage.ts"></script>
  </body>
</html>
