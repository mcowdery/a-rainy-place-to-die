<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animations: the batch</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #202226; color: #d8d8e0; }
      body { font: 12px/1.35 Consolas, 'Cascadia Mono', 'Yu Gothic', monospace; }
      canvas { display: block; }
      button { font: inherit; color: #d8d8e0; background: #22242c; border: 1px solid #3a3c48; cursor: pointer; padding: 2px 7px; }
      button:hover { background: #2e3140; }
      button.on { border-color: #ff5fc8; color: #ffb0e0; }
      #bar {
        position: fixed; top: 0; left: 0; right: 0; z-index: 3; padding: 5px 8px;
        background: rgba(10, 10, 14, 0.88); border-bottom: 1px solid #34343f;
      }
      #bar div { display: flex; flex-wrap: wrap; align-items: center; gap: 3px; margin: 2px 0; }
      #bar span { width: 44px; color: #7c8294; }
      #bar b { font-weight: normal; color: #fff; }
      #bar em { font-style: normal; color: #9aa0b0; margin-left: 10px; }
      /* Under a figure: its clip's name, whether it's not for whoever's list this is, and the clip's note. */
      .cell { position: fixed; z-index: 2; width: 168px; margin-left: -84px; margin-top: 4px; text-align: center; }
      .cell.alone { width: 460px; margin-left: -230px; }
      .cell button, .cell input { display: block; box-sizing: border-box; width: 100%; margin-top: 2px; padding: 2px 3px; background: rgba(10, 10, 14, 0.82); border: 1px solid #34343f; }
      .cell .mark { color: #7c8294; }
      .cell .mark.on { background: #5a1420; border-color: #ff5f6f; color: #fff; }
      .cell.out .name { text-decoration: line-through; color: #8d93a3; }
      .cell input { font: inherit; color: #ffe9a8; text-align: left; }
      .cell input::placeholder { color: #565b69; }
      .cell .name.liked { color: #9fe3b4; }
    </style>
  </head>
  <body>
    <div id="bar"></div>
    <script type="module" src="/src/poc3d/anims/batch.ts"></script>
  </body>
</html>
