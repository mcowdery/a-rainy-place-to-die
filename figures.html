<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Figures</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #202226; color: #d8d8e0; }
      body { font: 13px/1.4 Consolas, 'Cascadia Mono', monospace; }
      canvas { display: block; }
      #panel { position: fixed; top: 8px; right: 8px; z-index: 2; width: 270px; max-height: calc(100% - 16px); overflow: auto; padding: 8px 10px; background: rgba(10,10,14,.85); border: 1px solid #34343f; }
      #panel h3 { margin: 8px 0 4px; font-size: 12px; color: #9aa0b0; font-weight: normal; text-transform: uppercase; letter-spacing: 1px; }
      #panel button { display: block; box-sizing: border-box; width: 100%; margin: 2px 0; padding: 3px 6px; text-align: left; cursor: pointer; font: inherit; color: #d8d8e0; background: #22242c; border: 1px solid #3a3c48; }
      #panel button:hover { background: #2e3140; }
      #panel button.on { border-color: #ff5fc8; color: #ffb0e0; }
      #panel .row { display: flex; gap: 2px; }
      #panel .row button { text-align: center; }
      #hud { position: fixed; top: 8px; left: 8px; z-index: 2; padding: 6px 10px; white-space: pre; background: rgba(10,10,14,.8); border: 1px solid #34343f; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="hud"></div>
    <div id="panel"></div>
    <script type="module" src="/src/poc3d/figures/main.ts"></script>
  </body>
</html>
